experiment:
  name: ml-fref
  seed: 2
  phase: pilot
dataset:
  name: CIFAR10
  data_dir: data/raw
  clean_dataset_id: CIFAR10-CLEAN-V1
  download: true
  validation_split: 0.0
model:
  architecture: resnet18
  num_classes: 10
  pretrained: false
  cifar_stem: true
training:
  epochs: 30
  batch_size: 128
  optimizer: sgd
  learning_rate: 0.1
  momentum: 0.9
  weight_decay: 0.0005
  nesterov: false
  lr_scheduler: cosine
  loss: cross_entropy
  augmentation:
    random_crop_padding: 4
    horizontal_flip: true
  amp: true
  num_workers: 0
  device: auto
reproducibility:
  deterministic: true
  cudnn_benchmark: false
  warn_only: true
attack:
  type: backdoor
  poison_rate: 0.05
  target_class: airplane
  exclude_target_class_from_poisoning: true
  trigger:
    size: 3
    position: bottom_right
    offset: 1
    pattern: checkerboard
pipeline:
  mode: conventional
mlflow:
  enabled: false
  tracking_uri: sqlite:///mlruns/mlflow.db
  artifact_location: mlruns/artifacts
  experiment_name: ml-fref
evidence:
  forensic_enabled: false
  forensic_db: evidence/forensic/forensic_evidence.sqlite
  event_chain_hashing: false
  export_jsonl: false
deployment:
  simulate: true
  inference_requests: 200
ground_truth:
  db: ground_truth/ground_truth.sqlite
output:
  experiments_dir: experiments
  results_dir: results
  models_dir: models
  logs_dir: logs
  manifests_dir: data/manifests
logging:
  level: INFO
_meta:
  layers:
  - experiment.yaml
  - baseline.yaml
  - pilot_backdoor.yaml
  overrides:
  - experiment.seed=2
  - experiment.phase=pilot
  - attack.poison_rate=0.05
  config_sha256: 6eb458e62db61169c3d6fb5bb5f347257d38f6b28fb6bbe184f70fb94fc36737
