[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-fref"
version = "0.1.0"
description = "ML-FREF: Machine Learning Forensic Readiness Experimental Framework (MSc dissertation research prototype)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.9",
    "torchvision>=0.24",
    "mlflow>=3.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "PyYAML>=6.0",
    "psutil>=6.0",
    "networkx>=3.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "black>=24.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "slow: long-running tests (e.g. dataset download, training)",
    "gpu: tests that require CUDA",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# scripts add src/ to sys.path before importing the package
"scripts/*.py" = ["E402", "E501"]
"scripts/chapter4_results.py" = ["E402", "E501", "F841", "B007", "E731"]
