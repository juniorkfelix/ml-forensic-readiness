# Pilot attack overlay — LABEL FLIPPING (5%)
# Pipeline is chosen at run time, e.g.:
#   python scripts/run_label_flip.py --pipeline forensic --poison-rate 0.05 --seed 1
# which composes: experiment.yaml -> forensic.yaml -> this file -> CLI overrides.
extends: experiment.yaml

attack:
  type: label_flip
  poison_rate: 0.05       # fraction of the WHOLE training set (D-028): 2,500 of 5,000 automobiles
  source_class: automobile
  target_class: truck
