# Pilot attack overlay — BACKDOOR (5%)
# Pipeline is chosen at run time, e.g.:
#   python scripts/run_backdoor.py --pipeline forensic --poison-rate 0.05 --seed 1
extends: experiment.yaml

attack:
  type: backdoor
  poison_rate: 0.05       # fraction of the WHOLE training set that is triggered + relabelled
  target_class: airplane
  exclude_target_class_from_poisoning: true
  trigger:
    size: 3               # pixels (square)
    position: bottom_right
    offset: 1             # pixels from the image border
    pattern: checkerboard # fixed deterministic pattern (white/black checkerboard)
